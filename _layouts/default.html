<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }} — Climate &amp; society</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#f5f3ec">
  <meta property="og:title" content="{{ site.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:type" content="website">
  {% if site.url != empty %}<link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/prahelika.jpg' | absolute_url }}">{% endif %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}">Prahelika Deka<span class="brand-dot">.</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}#research">Research</a><a href="{{ '/' | relative_url }}#experience">Experience</a><a href="{{ '/' | relative_url }}#publications">Writing</a><a href="{{ '/' | relative_url }}#contact">Contact <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="wrap"><span>© {{ 'now' | date: '%Y' }} Prahelika Deka</span><a href="#main">Back to top ↑</a></footer>
</body>
</html>
